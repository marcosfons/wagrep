name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Versions
        run: python -c "import sqlite3, sys; print(sys.version, 'SQLite', sqlite3.sqlite_version)"
      - name: Unit tests
        run: make check PYTHON=python
